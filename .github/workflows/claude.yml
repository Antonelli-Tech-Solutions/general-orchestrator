name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Gate the entire workflow on the sender being in an allowlist of
    # trusted actors. Without this, any GitHub user could open an issue
    # or post a comment containing '@claude' on this public repo and
    # trigger a run that consumes the OAuth token's usage quota.
    #
    # The allowlist includes:
    #   - 'dantonel': the human operator.
    #   - 'claude-bot-dom[bot]': the GitHub App that posts comments from
    #     pr-merged-notifier and ci-failure-notifier. Without this,
    #     the sequential-issue handoff chain breaks after the first merge.
    #
    # To add or remove trusted actors, edit the fromJSON array below.
    if: |
      contains(fromJSON('["dantonel", "claude-bot-dom[bot]"]'), github.event.sender.login) && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && github.event.action == 'assigned' && github.event.assignee.login == 'dantonel') ||
        (github.event_name == 'issues' && github.event.action == 'opened' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CLAUDEBOT_APP_ID }}
          private-key: ${{ secrets.CLAUDEBOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          allowed_bots: claude-bot-dom
          github_token: ${{ steps.app-token.outputs.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          assignee_trigger: "dantonel"
          claude_args: '--allowedTools "Bash(gh issue create *),Bash(gh pr create *),Bash(gh pr merge *),Bash(gh pr view *),Bash(gh pr checks *),Bash(gh pr comment *),Bash(gh run view *),Bash(gh run list *),Bash(git status),Bash(git log *),Bash(git diff *),Bash(gh issue close *),Bash(gh issue comment *),Bash(gh issue list *),Bash(gh issue edit *),Bash(gh issue view *),Bash(gh label *),Bash(gh label create *),Bash(pip install *),Bash(pytest *),Bash(python -m pytest *),Bash(python -m pip install *),Bash(grep *),Bash(ls *)"'
          base_branch: main
          additional_permissions: |
            actions: read
