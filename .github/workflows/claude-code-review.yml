name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - '**/*.py'
      - '**/*.toml'
      - '**/*.md'
      - '**/*.yml'
      - '**/*.yaml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'

jobs:
  claude-review:
    # Only review PRs authored by trusted users. This prevents strangers
    # from burning the OAuth token's usage quota by opening PRs on this
    # public repo.
    if: contains(fromJSON('["dantonel"]'), github.event.pull_request.user.login)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: "claude-bot-dom[bot]"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
