name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .

      - name: Run tests
        run: |
          pytest -q
        env:
          # Tests should not hit real GitHub or invoke the claude CLI.
          # Individual tests that need these are responsible for mocking.
          GITHUB_TOKEN: "dummy-token-for-ci"
          GITHUB_REPO: "example/repo"
