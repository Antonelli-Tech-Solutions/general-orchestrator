name: PR Merged Notifier
on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  notify:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'claude/')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CLAUDEBOT_APP_ID }}
          private-key: ${{ secrets.CLAUDEBOT_PRIVATE_KEY }}

      - name: Find linked issue and notify
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const prBody = context.payload.pull_request.body || '';
            const prNumber = context.payload.pull_request.number;

            const match = prBody.match(/(?:closes|fixes|resolves|issue)\s+#(\d+)/i);
            if (!match) {
              console.log('No linked issue found in PR body');
              return;
            }

            const issueNumber = parseInt(match[1]);

            // Get issue and all comments
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            // Check issue body and all comments for handoff instruction
            const allText = [
              issue.data.body || '',
              ...comments.data.map(c => c.body)
            ];

            // Find handoff line and extract target issue number
            let nextIssueNumber = null;
            for (const text of allText) {
              const m = text.match(/when this issue is completed,?\s*assign\s+issue\s+#(\d+)\s+to\s+(\S+)/i);
              if (m) {
                nextIssueNumber = parseInt(m[1]);
                break;
              }
            }

            if (!nextIssueNumber) {
              console.log('No handoff instruction found, skipping');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `@claude PR #${prNumber} has been merged. Please run:\n\n\`\`\`\ngh issue edit ${nextIssueNumber} --add-assignee dantonel\n\`\`\`\n\nto hand off to the next task.`
            });
