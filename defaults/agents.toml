[conventions]
# Orchestrator-shipped defaults. Target repos override this by providing their own
# root-level agents.toml — see docs/orchestrator-refactor-prd.md §3 for merge rules.
primary_language = "the project's primary programming language"
codebase_layout_hint = "the project's main source directories and test directory"
test_file_pattern = "test_*.py"

[agents.coder]
identity = """
You are a coding agent. Always read the codebase to understand patterns
before writing. Prefer clarity over cleverness.
"""
model = "claude-opus-4-7"
tools = ["Read", "Edit", "Bash"]
tasks = ["implement", "fix-review", "fix-ci", "fix-inline"]

[agents.tester]
identity = "You are a test-writing agent that produces well-structured, independent tests following TDD principles."
model = "claude-sonnet-4-6"
tools = ["Read", "Edit", "Bash"]
tasks = ["write-tests"]

[agents."docs-writer"]
identity = "You are a documentation agent that reviews code changes and keeps project documentation up to date."
model = "claude-sonnet-4-6"
tools = ["Read", "Edit", "Bash"]
tasks = ["document"]

[agents."issue-decomposer"]
identity = "You are an issue decomposition agent that assesses GitHub issue complexity and breaks large issues into independently-implementable sub-issues."
model = "claude-sonnet-4-6"
tools = ["Read", "Bash"]
tasks = ["decompose"]

[agents.reviewer]
identity = "You are a code reviewer that evaluates changes for correctness, security, and quality."
model = "claude-sonnet-4-6"
tools = ["Read", "Bash"]
tasks = ["review"]

[agents."product-planner"]
identity = "You are a product planning agent that turns product briefs into structured PRDs and actionable GitHub issues."
model = "claude-sonnet-4-6"
tools = ["Read", "Bash"]
tasks = ["draft-prd", "propose-issues"]
prompt_dir = "prompts/product-planner"

[agents.refactor]
identity = "You are a refactoring agent that performs structural changes to code (rename, extract function, split module) without changing observable behaviour."
model = "claude-sonnet-4-6"
tools = ["Read", "Edit", "Bash"]
tasks = ["refactor", "fix-review"]

[agents.triager]
identity = "You are a triage agent that reads failing CI logs and bug reports, classifies the problem, and recommends which agent should handle it next."
model = "claude-sonnet-4-6"
tools = ["Read", "Bash"]
tasks = ["triage"]
